<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxograma — template</title>
  <style>
    :root {
      --color-paper: #f4f1ea;
      --color-ink: #1b2430;
      --color-muted: #4a5562;
      --color-line: #c8c3b8;
      --color-accent: #0f5c6b;
      --color-accent-ink: #f4f1ea;
      --color-node: #ffffff;
      --color-node-stroke: #1b2430;
      --color-recusado: #8a3b32;
      --font-sans: system-ui, "Segoe UI", "Liberation Sans", Roboto, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Liberation Mono", "Segoe UI Mono", monospace;
    }
    html, body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); }
    main { max-width: 920px; margin: 0 auto; padding: 32px 24px 48px; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 4px; }
    .meta { color: var(--color-muted); font-size: 0.85rem; margin: 0 0 24px; }
    svg { width: 100%; height: auto; display: block; background: var(--color-paper); }
    text { font-family: var(--font-sans); }

  </style>
</head>
<body>
  <main>
    <h1>Fluxograma — template</h1>
    <p class="meta">Losango = decisão. Verde-petróleo = caminho aceito. Vermelho-terroso = recusado.</p>
    <svg viewBox="0 0 800 360" role="img" aria-labelledby="t d">
      <title id="t">Template de fluxograma</title>
      <desc id="d">Uma pergunta e dois ramos, aceito e recusado.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)"/>
        </marker>
      </defs>
      <polygon points="400,40 520,100 400,160 280,100" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="400" y="104" text-anchor="middle" font-size="14" fill="var(--color-ink)">Pergunta?</text>
      <line x1="280" y1="100" x2="160" y2="100" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="160" y1="100" x2="160" y2="200" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="210" y="90" font-size="12" fill="var(--color-recusado)">não</text>
      <rect x="70" y="200" width="180" height="70" rx="8" fill="var(--color-node)" stroke="var(--color-recusado)" stroke-width="1.5"/>
      <text x="160" y="240" text-anchor="middle" font-size="14" fill="var(--color-recusado)">Recusado</text>
      <line x1="520" y1="100" x2="640" y2="100" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="640" y1="100" x2="640" y2="200" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="560" y="90" font-size="12" fill="var(--color-accent)">sim</text>
      <rect x="550" y="200" width="180" height="70" rx="8" fill="var(--color-accent)"/>
      <text x="640" y="240" text-anchor="middle" font-size="14" fill="var(--color-accent-ink)">Aceito</text>
    </svg>

  </main>
</body>
</html>

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: pip install ruff==0.17.6 && ruff check src tests

      - name: Testes
        run: python -m unittest discover -s tests -v

      # Provisório no template hello: o "build" só compila o código (compileall)
      # até o projeto ter um passo de build próprio (bundle, wheel, etc.).
      - name: Build
        run: python -m compileall -q src

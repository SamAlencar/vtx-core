name: ci

on:
  push:
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: python -m compileall -q src tests

      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m compileall -q src

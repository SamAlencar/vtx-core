name: sincronizar-painel

on:
  push:
    branches: [main]
    paths:
      - "backlog/**"
      - "scripts/exportar_painel.py"
      - "scripts/backlog_lib.py"
  schedule:
    - cron: "0 9 * * *"   # diariamente às 06:00 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vtx-core
        uses: actions/checkout@v4

      - name: Checkout vtx_painel
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vtx_painel
          token: ${{ secrets.PANEL_TOKEN }}
          path: painel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exportar backlog sanitizado
        run: |
          pip install pyyaml
          python scripts/exportar_painel.py backlog painel/data/backlog.json

      - name: Publicar no painel
        working-directory: painel
        run: |
          git config user.name "vtx-bot"
          git config user.email "vtx-bot@users.noreply.github.com"
          git add data/backlog.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore(painel): atualizar backlog $(date -u +%Y-%m-%d)"
            git push
          fi

name: testes

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml ifcopenshell==0.9.0.post1 ifctester==0.9.0

      - name: Rodar testes
        run: python -m unittest discover -s tests -v

name: testes

on:
  push:
  pull_request:

# VTX-229: padrão do workflow; ifc-web e qualidade herdam (antes ficavam
# com as permissões padrão do token). Jobs que já declaram o mesmo ficam explícitos.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pacote e o ruff (teste do bootstrap roda o Lint do projeto gerado)
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: python -m unittest discover -s tests -v


  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pacote e as ferramentas
        run: pip install -e ".[dev]"

      - name: ruff e mypy
        run: ruff check core scripts tests && mypy core/vtx_ifc

  ifc-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cursor/skills/ifc-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes, tipos e bundle
        run: npm test && npm run typecheck && npm run build

  web-next:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/web-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint, tipos e testes do template
        run: npm run lint && npm run typecheck && npm test && npm run evals && npm run build

  web-gerado:
    # VTX-209: gera um projeto pelo bootstrap e roda o pipeline dele, para pegar
    # quebra que só aparece no projeto gerado (nome, cópia de arquivos, lock).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar projeto web pelo bootstrap
        run: bash scripts/bootstrap_projeto.sh --tipo web demo "$RUNNER_TEMP/demo"

      - name: Pipeline do projeto gerado
        working-directory: ${{ runner.temp }}/demo
        run: npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test && npm run evals && npm run build

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml

      - name: Validar backlog e INDEX
        run: python scripts/validar_backlog.py

      - name: Verificar links relativos
        run: python scripts/verificar_links.py

      - name: Gitleaks no diff
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            ./gitleaks detect --no-banner --redact --log-opts="${BASE}..${GITHUB_SHA}"
          else
            ./gitleaks detect --no-banner --redact --log-opts="-1"
          fi


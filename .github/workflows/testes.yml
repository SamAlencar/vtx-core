name: testes

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pacote
        run: pip install -e .

      - name: Rodar testes
        run: python -m unittest discover -s tests -v

  ifc-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cursor/skills/ifc-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes, tipos e bundle
        run: npm test && npm run typecheck && npm run build

  web-next:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/web-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint, tipos e testes do template
        run: npm run lint && npm run typecheck && npm test

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml

      - name: Validar backlog e INDEX
        run: python scripts/validar_backlog.py

      - name: Verificar links relativos
        run: python scripts/verificar_links.py

      - name: Gitleaks no diff
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            ./gitleaks detect --no-banner --redact --log-opts="${BASE}..${GITHUB_SHA}"
          else
            ./gitleaks detect --no-banner --redact --log-opts="-1"
          fi


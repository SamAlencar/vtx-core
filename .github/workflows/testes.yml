name: testes

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml ifcopenshell==0.9.0.post1 ifctester==0.9.0 jsonschema==4.26.0

      - name: Rodar testes
        run: python -m unittest discover -s tests -v

  ifc-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cursor/skills/ifc-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes, tipos e bundle
        run: npm test && npm run typecheck && npm run build

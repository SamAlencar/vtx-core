- id: VTX-225
  titulo: Proteção real da branch main (ruleset ou hook de pre-push)
  fase: F1
  area: Qualidade
  prioridade: 65
  status: a fazer
  entregavel: .githooks/pre-push
  notas: 'Seguimento da revisão do Tzu no PR #28 (item 1), 26/11/2026. O repositório privado no plano gratuito não tem proteção de branch (API 403); o .cursor/cli.json é hoje a única barreira técnica contra push direto em main, e não cobre git push sem argumentos nem contorno via Shell. Tarefa: hook de pre-push local que rejeita push para main (incluindo refspec e git push sem argumentos quando o upstream é main) e, quando o plano do GitHub permitir, ruleset de proteção. Arquivos: .githooks/pre-push (ou caminho equivalente documentado no AGENTS.md), teste do hook, knowledge/ferramentas/ia-dev/cursor.md §8. Aceite: o hook rejeita git push origin main, git push origin HEAD:main e git push sem argumentos com upstream em main, e deixa passar push da branch do PR; documentar o limite se o hook puder ser contornado com --no-verify (já negado no cli.json). Relacionada à VTX-214 (script de merge).'

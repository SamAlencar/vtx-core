- id: VTX-214
  titulo: Portão de merge sem proteção de branch
  fase: F1
  area: Qualidade
  prioridade: 66
  status: a fazer
  entregavel: scripts/mesclar_pr.sh
  notas: 'Auditoria técnica de 25/11/2026 (§4, P1 item 12), importada em 26/11/2026. Tarefa: o repositório privado no plano gratuito não aceita required checks (API 403). Criar scripts/mesclar_pr.sh <n> que só chama gh pr merge se gh pr checks <n> estiver todo verde e a HEAD tiver a aprovação registrada, e tornar esse script o único caminho de merge previsto no AGENTS.md. Arquivos: scripts/mesclar_pr.sh, tests/test_mesclar_pr.py, AGENTS.md. Aceite: teste com gh simulado (stub no PATH) mostra que o script sai com código diferente de 0 e não chama merge quando há check vermelho ou pendente, e chama merge quando tudo está verde. Relacionada à VTX-172 (aguardando decisão do Samuel), que esta tarefa contorna sem custo. Ampliação de 26/11/2026 (orientações do Samuel, item 4; knowledge/processos/porta-para-producao.md): a aprovação conferida é o veredito do revisor de IA escrito no PR com o SHA da HEAD final (Aprovado, ou Aprovado com ressalvas só de itens não bloqueantes, depois de aplicadas as ressalvas bloqueantes e de um veredito novo nessa HEAD); PR com a etiqueta precisa do Samuel exige também o OK do Samuel no PR; o script usa --match-head-commit. Depois dela, decidir com o Samuel se PR trivial pode mesclar só com CI verde.'


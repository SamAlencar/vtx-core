    notas: "Entregue no PR #42 (fica em andamento até o merge): flag critica na ToolDefinicao; o harness grava a ação pendente e devolve PENDENTE_APROVACAO com acao_id; execução só via POST /api/agentes/acoes/[id]/aprovar (usuário autenticado, reivindicação atômica, 409 com o resultado gravado na segunda aprovação, auditoria criada/aprovada/executada); migração supabase/migrations/20261127000000_acoes_pendentes.sql (acoes_pendentes e acoes_auditoria com RLS por usuário); follow-ups da VTX-177: AbortSignal repassado às tools e circuit breaker após 401/403 do principal. Escrita no banco só no servidor (RLS authenticated só SELECT; teste estático da migração). Rejeitar, TTL, lease de executando e retomada do fluxo após aprovar. Repositório Supabase fica na VTX-230; RLS ao vivo na VTX-216 (padrão em memória falha seguro com 404). Skills: writing-plans (docs/planos/2026-11-27-vtx-213.md), verification-before-completion (lint, typecheck, test, evals, build; unittest, ruff, mypy, validadores). Ferramentas: git, gh, npm, vitest, eslint, tsc, next build, AI SDK MockLanguageModelV4, zod, python, ruff, mypy. Como foi: ajudou; red-green conferido nos testes de signal, circuit breaker e idempotência."

    responsavel: "agente-orquestrador"
    notas: "Neste PR (#44): RepositorioAcoes via RPCs acoes_criar/reivindicar/concluir/rejeitar com service_role (lib/supabase-admin.ts, acoes-supabase.ts, acoes-padrao.ts). Sem a chave, o padrão cai em memória (falha segura, 404). auditar() no cliente Supabase é no-op porque as RPCs já auditam e o harness ainda chama auditar após criar. A chave não entra em lib/env.ts (EnvPublico). Correção da revisão: acaoDaRpc trata o composto nulo do PostgREST (`return null` numa função que devolve acoes_pendentes chega como objeto com id null, não como data vazio). Testes de contrato com mock nesse formato e teste ao vivo em scripts/teste-rpc-acoes-composto-nulo.sh. RLS ao vivo das tabelas permanece na VTX-216. Skills: verification-before-completion. Ferramentas: git, gh, npm, vitest, eslint, tsc, postgres 17 local."

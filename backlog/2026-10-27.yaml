    notas: "knowledge/tecnologia/ux-ui-acessibilidade.md: meta WCAG 2.2 AA e LBI art. 63, critérios AA que mais reprovam (contraste 4,5:1/3:1, teclado e foco não escondido, alvo 24 px, reflow 320 px e zoom 200%, alternativa ao arrastar, login sem teste de memória, entrada redundante), HTML semântico antes de ARIA, movimento com prefers-reduced-motion, metodologia por tela (4 estados, shadcn/ui + Cult UI ou KokonutUI sem misturar na mesma tela, tokens com contraste, texto de interface, formulários, mobile 44pt/48dp, axe + teclado + zoom + leitor de tela), exemplo de campo CPF e checklist de PR; link a partir de frontend-web.md. Skills: writing-plans (plano em docs/planos/2026-10-27-vtx-028-099.md; Review Focus trouxe animação sem reduced-motion e div clicável dos componentes copiados, ajudou), verification-before-completion (test -e nos links relativos, URLs HTTP 200; site do Planalto não respondeu do box e ficou anotado no doc; unittest verde, ajudou), brainstorming não aplicada (não é spec/PRD). Bibliotecas: radar Cult UI e KokonutUI (regra de uso incorporada, não instaladas), recursos.yaml (impeccable/emilkowalski seguem em avaliação, não usados). Ferramentas: git, curl, python. Correu bem, custo baixo."

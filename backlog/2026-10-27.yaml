    notas: "knowledge/ferramentas/hospedagem/vercel.md no modelo de 10 seções do catálogo: Hobby só para uso interno não comercial (uso comercial inclui consultor pago que escreveu o código, então sites de cliente e os comerciais VTX/Tekto/med-hub exigem Pro), limites do Hobby (100 GB, 1 mi requisições/invocações, 4 h CPU ativa, 5 mil imagens; estourou = pausa até 30 dias), Pro US$ 20/assento dev com US$ 20 de crédito, senha +US$ 20/projeto; alternativas Cloudflare/GitHub Pages; região padrão iad1, fixar gru1 perto do Supabase; variáveis Secret por ambiente; preview protegido sem dados reais; ADR curto. Decisão de plano pago/uso comercial NÃO tomada: fica com o Samuel (A2), sem travar a tarefa. Fatos conferidos na doc oficial em 27/10. Matriz do README continua para a VTX-112. Skills: writing-plans (mesmo plano; Review Focus pegou o risco de site comercial no Hobby e a região iad1, ajudou), verification-before-completion (10 seções, links e URLs 200, preço por assento conferido na página de preços após correção de 'por membro', ajudou). Bibliotecas: recursos.yaml (vercel-agent-skills em avaliação, não usada). Ferramentas: git, curl, python (MCP da Vercel não foi preciso). Correu bem."

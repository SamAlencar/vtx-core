  - id: graphify
    nome: Graphify
    area: skills-agentes
    tipo: skill
    link: "https://github.com/Graphify-Labs/graphify"
    licenca: Apache-2.0
    status: "adotado"
    uso_agentes: "Opcional, só em repositórios grandes: montar o grafo (`graphify update`) antes de varrer código, para perguntas de impacto/chamadas. Não integrar via `graphify install` por enquanto. Avaliação: knowledge/ferramentas/avaliacoes/graphify.md (piloto Tek no tekto-model, ~49% menos contexto)."
    riscos: "Pasta graphify-out/ ~5 MB — obrigatório no .gitignore. Nunca ativar análise com IA (GEMINI_API_KEY); manter só AST local. Grafo envelhece a cada commit. `graphify install` cria skill/regra always-on — não usar ainda."
    responsavel: orquestrador

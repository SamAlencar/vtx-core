<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADR-001: refazer a plataforma do zero</title>
  <style>
    :root {
      --color-paper: #f4f1ea;
      --color-ink: #1b2430;
      --color-muted: #4a5562;
      --color-line: #c8c3b8;
      --color-accent: #0f5c6b;
      --color-accent-ink: #f4f1ea;
      --color-node: #ffffff;
      --color-node-stroke: #1b2430;
      --color-recusado: #8a3b32;
      --font-sans: system-ui, "Segoe UI", "Liberation Sans", Roboto, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Liberation Mono", "Segoe UI Mono", monospace;
    }
    html, body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); }
    main { max-width: 920px; margin: 0 auto; padding: 32px 24px 48px; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 4px; }
    .meta { color: var(--color-muted); font-size: 0.85rem; margin: 0 0 24px; }
    svg { width: 100%; height: auto; display: block; background: var(--color-paper); }
    text { font-family: var(--font-sans); }

  </style>
</head>
<body>
  <main>
    <h1>ADR-001: refazer a plataforma do zero</h1>
    <p class="meta">Fluxograma da decisão de 18/10/2026 (A2). Repositórios antigos ficam só como referência; nenhum código é copiado.</p>
    <svg viewBox="0 0 860 520" role="img" aria-labelledby="t d">
      <title id="t">Decisão de refazer a plataforma do zero</title>
      <desc id="d">A partir da plataforma antiga, três caminhos: reaproveitar e híbrida recusados; refazer do zero aceito, gerando projeto novo com schema limpo e os repositórios antigos só como referência.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)"/>
        </marker>
      </defs>
      <rect x="280" y="20" width="300" height="70" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="430" y="50" text-anchor="middle" font-size="14" fill="var(--color-ink)">Plataforma antiga</text>
      <text x="430" y="70" text-anchor="middle" font-size="11" fill="var(--color-muted)">dívida, sem testes, riscos de segurança</text>
      <line x1="430" y1="90" x2="430" y2="130" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <polygon points="430,130 580,185 430,240 280,185" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="430" y="180" text-anchor="middle" font-size="14" fill="var(--color-ink)">O que fazer com o código?</text>
      <text x="430" y="198" text-anchor="middle" font-size="11" fill="var(--color-muted)">decisão de 18/10/2026</text>
      <!-- left recusado -->
      <line x1="280" y1="185" x2="130" y2="185" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="130" y1="185" x2="130" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="200" y="175" font-size="11" fill="var(--color-recusado)">A</text>
      <rect x="40" y="280" width="180" height="64" rx="8" fill="var(--color-node)" stroke="var(--color-recusado)" stroke-width="1.5"/>
      <text x="130" y="306" text-anchor="middle" font-size="13" fill="var(--color-recusado)">Reaproveitar</text>
      <text x="130" y="326" text-anchor="middle" font-size="11" fill="var(--color-recusado)">recusado</text>
      <!-- mid recusado -->
      <line x1="430" y1="240" x2="430" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="448" y="268" font-size="11" fill="var(--color-recusado)">C</text>
      <rect x="340" y="280" width="180" height="64" rx="8" fill="var(--color-node)" stroke="var(--color-recusado)" stroke-width="1.5"/>
      <text x="430" y="306" text-anchor="middle" font-size="13" fill="var(--color-recusado)">Híbrida (copiar partes)</text>
      <text x="430" y="326" text-anchor="middle" font-size="11" fill="var(--color-recusado)">recusado</text>
      <!-- right accepted -->
      <line x1="580" y1="185" x2="730" y2="185" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="730" y1="185" x2="730" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="620" y="175" font-size="11" fill="var(--color-accent)">B · aceito</text>
      <rect x="630" y="280" width="200" height="64" rx="8" fill="var(--color-accent)"/>
      <text x="730" y="306" text-anchor="middle" font-size="13" fill="var(--color-accent-ink)">Refazer do zero</text>
      <text x="730" y="326" text-anchor="middle" font-size="11" fill="var(--color-accent-ink)">projeto novo, A2</text>
      <line x1="730" y1="344" x2="730" y2="390" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="580" y="390" width="260" height="80" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="710" y="422" text-anchor="middle" font-size="13" fill="var(--color-ink)">Schema único, testado</text>
      <text x="710" y="442" text-anchor="middle" font-size="11" fill="var(--color-muted)">repos antigos só como referência</text>
      <text x="710" y="458" text-anchor="middle" font-size="11" fill="var(--color-muted)">sem service role no front, sem exec_sql</text>
    </svg>

  </main>
</body>
</html>

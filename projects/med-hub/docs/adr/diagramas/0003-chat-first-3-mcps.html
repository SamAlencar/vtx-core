<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADR-003: arquitetura chat-first com 3 MCPs</title>
  <style>
    :root {
      --color-paper: #f4f1ea;
      --color-ink: #1b2430;
      --color-muted: #4a5562;
      --color-line: #c8c3b8;
      --color-accent: #0f5c6b;
      --color-accent-ink: #f4f1ea;
      --color-node: #ffffff;
      --color-node-stroke: #1b2430;
      --color-recusado: #8a3b32;
      --font-sans: system-ui, "Segoe UI", "Liberation Sans", Roboto, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Liberation Mono", "Segoe UI Mono", monospace;
    }
    html, body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); }
    main { max-width: 920px; margin: 0 auto; padding: 32px 24px 48px; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 4px; }
    .meta { color: var(--color-muted); font-size: 0.85rem; margin: 0 0 24px; }
    svg { width: 100%; height: auto; display: block; background: var(--color-paper); }
    text { font-family: var(--font-sans); }

  
  </style>
</head>
<body>
  <main>
    <h1>ADR-003: arquitetura chat-first com 3 MCPs</h1>
    <p class="meta">O médico fala pelo chat com o Assistente. Só o MCP da plataforma acessa o banco, com o token do usuário. Contábil e jurídico não veem dados de cliente.</p>
    <svg viewBox="0 0 920 500" role="img" aria-labelledby="t d">
      <title id="t">Chat-first com assistente e três MCPs</title>
      <desc id="d">O médico chega ao Assistente pelo chat. Parceiro e admin usam o monólito modular de telas. O Assistente chama três MCPs; só o da plataforma fala com o Supabase.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)"/>
        </marker>
      </defs>
      <rect x="40" y="40" width="180" height="72" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="130" y="70" text-anchor="middle" font-size="14" fill="var(--color-ink)">Médico</text>
      <text x="130" y="90" text-anchor="middle" font-size="11" fill="var(--color-muted)">usa o chat</text>
      <rect x="40" y="160" width="180" height="72" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="130" y="190" text-anchor="middle" font-size="14" fill="var(--color-ink)">Parceiro / admin</text>
      <text x="130" y="210" text-anchor="middle" font-size="11" fill="var(--color-muted)">usam telas</text>
      <line x1="220" y1="196" x2="300" y2="196" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="300" y="156" width="210" height="80" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="405" y="190" text-anchor="middle" font-size="14" fill="var(--color-ink)">Web (monólito modular)</text>
      <text x="405" y="210" text-anchor="middle" font-size="11" fill="var(--color-muted)">conta, onboarding, admin…</text>
      <line x1="220" y1="76" x2="650" y2="76" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="650" y1="76" x2="650" y2="110" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="560" y="110" width="180" height="80" rx="8" fill="var(--color-accent)"/>
      <text x="650" y="144" text-anchor="middle" font-size="14" fill="var(--color-accent-ink)">Assistente</text>
      <text x="650" y="164" text-anchor="middle" font-size="11" fill="var(--color-accent-ink)">TypeScript + SDK MCP</text>
      <line x1="650" y1="190" x2="650" y2="250" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="160" y1="250" x2="730" y2="250" stroke="var(--color-ink)" stroke-width="1.5"/>
      <line x1="160" y1="250" x2="160" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="450" y1="250" x2="450" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="730" y1="250" x2="730" y2="280" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="40" y="280" width="240" height="90" rx="8" fill="var(--color-accent)"/>
      <text x="160" y="312" text-anchor="middle" font-size="14" fill="var(--color-accent-ink)">MCP da plataforma</text>
      <text x="160" y="332" text-anchor="middle" font-size="11" fill="var(--color-accent-ink)">único com acesso ao banco</text>
      <text x="160" y="350" text-anchor="middle" font-size="11" fill="var(--color-accent-ink)">token do usuário, respeita RLS</text>
      <rect x="340" y="280" width="220" height="90" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="450" y="312" text-anchor="middle" font-size="14" fill="var(--color-ink)">MCP contábil</text>
      <text x="450" y="332" text-anchor="middle" font-size="11" fill="var(--color-muted)">conhecimento/contabil/</text>
      <text x="450" y="350" text-anchor="middle" font-size="11" fill="var(--color-muted)">sem dados de cliente</text>
      <rect x="620" y="280" width="220" height="90" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="730" y="312" text-anchor="middle" font-size="14" fill="var(--color-ink)">MCP jurídico</text>
      <text x="730" y="332" text-anchor="middle" font-size="11" fill="var(--color-muted)">checklists e modelos</text>
      <text x="730" y="350" text-anchor="middle" font-size="11" fill="var(--color-muted)">nunca dá parecer</text>
      <line x1="160" y1="370" x2="160" y2="410" stroke="var(--color-ink)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="40" y="410" width="240" height="60" rx="8" fill="var(--color-node)" stroke="var(--color-node-stroke)" stroke-width="1.5"/>
      <text x="160" y="435" text-anchor="middle" font-size="13" fill="var(--color-ink)">Supabase (Postgres + RLS)</text>
      <text x="160" y="455" text-anchor="middle" font-size="11" fill="var(--color-muted)">escrita com confirmação e auditoria</text>
    </svg>
  </main>
</body>
</html>

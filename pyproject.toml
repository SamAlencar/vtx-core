[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtx-core"
version = "0.1.0"
description = "Núcleo de funções de domínio da VTX (pacote vtx_ifc)."
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "ifcopenshell==0.9.0.post1",
  "ifctester==0.9.0",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
vtx_ifc = ["exemplo.ids"]

[project.optional-dependencies]
dev = [
  "ruff==0.17.6",
  "mypy==2.4.1",
  "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
target-version = "py312"
src = ["core", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "BLE", "EXE", "PLW", "FURB"]

[tool.ruff.lint.per-file-ignores]
# scripts e testes inserem sys.path antes de importar módulos locais.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
packages = ["vtx_ifc"]
warn_unused_ignores = true

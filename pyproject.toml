[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtx-core"
version = "0.1.0"
description = "Núcleo de funções de domínio da VTX (pacote vtx_ifc)."
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "ifcopenshell==0.9.0.post1",
  "ifctester==0.9.0",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
vtx_ifc = ["exemplo.ids"]
